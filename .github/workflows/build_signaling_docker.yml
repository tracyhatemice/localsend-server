name: Build signaling Docker image

# Builds the WebRTC signaling server image and pushes it to GHCR.
# The image is fully runtime-configured (STUN/TURN/limits via env vars),
# so one generic image serves every deployment — nothing is baked in.

on:
  push:
    branches: [feat/room-codes]
    paths:
      - 'server/**'
      - 'packages/core/**'
      - 'packages/localsend_isolates/rust/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build_signaling_docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Rebases force-push this branch; cancel superseded builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/localsend-signaling
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
